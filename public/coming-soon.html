<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>held0 — coming soon</title>
<link rel="icon" href="/icon.svg">
<style>
  :root { color-scheme: light dark; --bg: #fafafa; --fg: #111; --muted: #777; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b0b0b; --fg: #eee; --muted: #888; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: ui-monospace, "JetBrains Mono", SFMono-Regular, Menlo, monospace;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; text-align: center;
  }
  h1 { font-size: clamp(2.5rem, 8vw, 4.5rem); font-weight: 600; letter-spacing: -0.04em; margin: 0; }
  h1 span { animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  p { color: var(--muted); margin: 1rem 0 0; font-size: 1rem; }
  footer { position: fixed; bottom: 24px; font-size: 0.8rem; }
  footer a { color: var(--muted); text-decoration: none; margin: 0 0.6rem; }
  footer a:hover { color: var(--fg); }
</style>
</head>
<body>
  <h1>held0<span>_</span></h1>
  <p>Coming soon.</p>
  <footer>
    <a href="/impressum">Impressum</a>
    <a href="/datenschutz">Datenschutz</a>
  </footer>
</body>
</html>
