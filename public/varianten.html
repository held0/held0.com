<script>

// ---------- Idee 1: Terminal (Basis = heutige Seite) ----------
const T = [
  { n: "wie heute", bg: "#0b0b0b", fg: "#eee", mu: "#888", mode: "cursor" },
  { n: "Prompt: ls projekte", bg: "#0b0b0b", fg: "#e8e8e8", mu: "#7a7a7a", ac: "#7ee787", mode: "prompt" },

function terminal(v) {

  if (v.mode === "json") body = `<main><pre>{\n  <span class="ac">"held0"</span>: {\n${P.map(([n, d], i) => `    ${A(n, `<span class="ac">"${n}"</span>`)}: <span class="mu">"${d}"</span>${i < P.length - 1 ? "," : ""}`).join("\n")}\n  }\n}</pre></main>`;

function editorial(v) {
  let body = "";
  if (v.mode === "toc") body = `<main><p class="kick">Inhalt</p><h1>held0</h1>${P.map(([n, d], i) => `<div class="toc">${A(n)}<span class="dots"></span><span class="mu">${i + 1}</span></div><p class="d">${d}</p>`).join("")}</main>`;

  if (v.mode === "twocol") body = `<main style="max-width:52rem"><h1>held0</h1><div class="two">${P.map(([n, d]) => `<div><h2>${A(n)}</h2><p class="mu"><span class="drop ac">${d[0]}</span>${d.slice(1)}.</p></div>`).join("")}</div></main>`;
  if (v.mode === "bignum") body = `<main style="max-width:48rem"><h1 style="font-size:1.1rem;letter-spacing:.2em;text-transform:uppercase">held0</h1>${P.map(([n, d], i) => `<div class="big"><span class="bn">${i + 1}</span><div>${A(n)}<p class="mu">${d}</p></div></div>`).join("")}</main>`;
  if (v.mode === "footnotes") body = `<main><h1>held0</h1><p style="font-size:1.35rem;line-height:1.7">Gerade live sind ${P.map(([n], i) => `${A(n)}<sup class="mu">${i + 1}</sup>`).join(", ").replace(/, ([^,]*)$/, " und $1")}.</p><hr><ol class="mu">${P.map(([, d]) => `<li>${d}.</li>`).join("")}</ol></main>`;
  return page(`body{background:${v.bg};color:${v.fg};font-family:"${v.font}",Georgia,serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:12vh 28px 28px}
main{width:100%;max-width:38rem;flex:1}h1{font-weight:400;font-size:clamp(3rem,10vw,5.5rem);letter-spacing:-.02em;margin:0 0 2.5rem;line-height:1}

function brutal(v) {

  if (v.mode === "grid") body = `<h1>[held0]</h1><div class="g">${P.map(([n, d], i) => `<div class="cell"><small>0${i + 1}</small>${A(n)}<p>${d}</p></div>`).join("")}</div>`;
  return page(`body{background:${v.bg};color:${v.fg};font-family:"Archivo Black","Arial Black",sans-serif;min-height:100vh;padding:24px;margin:0}

const ALL = IDEAS.flatMap(([idea, vs, fn], ii) => vs.map((v, vi) => ({ id: `${ii + 1}.${vi}`, ii, vi, idea, name: v.n, html: () => fn(v) })));

// Ausgeblendete Varianten pro Browser merken
const HKEY = "held0-varianten-raus";
let hidden = new Set(); try { hidden = new Set(JSON.parse(localStorage.getItem(HKEY) || "[]")); } catch {}
const saveHidden = () => { try { localStorage.setItem(HKEY, JSON.stringify([...hidden])); } catch {} };
const visible = () => { const v = ALL.filter((x) => !hidden.has(x.id)); return v.length ? v : ALL; };

const q = new URLSearchParams(location.search);
let phone = q.get("handy") === "1" || matchMedia("(max-width: 720px)").matches;
let cur = Math.max(0, visible().findIndex((x) => x.id === q.get("v")));
const frame = document.createElement("iframe"); document.body.prepend(frame);
const ctl = document.getElementById("ctl");
const fit = () => { document.body.classList.toggle("phone", phone); document.documentElement.style.setProperty("--s", Math.min(1, (innerHeight - 90) / 864, (innerWidth - 30) / 410)); };
addEventListener("resize", fit);

function render() {
  const V = visible(), x = V[cur];
  const ideas = [...new Set(V.map((v) => v.ii))];
  ctl.innerHTML = `<button data-a="prev">←</button><b>${x.id} · ${x.name}</b><span class="idea">${x.idea}</span><button data-a="next">→</button><span class="sep"></span>` +
    ideas.map((ii) => `<button data-ii="${ii}" class="${ii === x.ii ? "on" : ""}">${IDEAS[ii][0]}</button>`).join("") +
    `<span class="sep"></span><button data-a="out" title="Taste X">✕ raus</button>${hidden.size ? `<button data-a="restore">↺ ${hidden.size} ausgeblendet</button>` : ""}<button data-a="phone">${phone ? "📱 Handy" : "🖥 Desktop"}</button><button data-a="full">⛶ Vollbild</button><button data-a="hide">✕</button>`;
  ctl.scrollLeft = 0;
}
function show(i) {
  const V = visible();
  cur = (i + V.length) % V.length;
  frame.srcdoc = V[cur].html();
  render();
  history.replaceState(null, "", `?v=${V[cur].id}${phone ? "&handy=1" : ""}`);
}
// innerhalb der Idee blättern bzw. zur nächsten/vorigen Idee springen
function idea(step) {
  const V = visible(), ids = [...new Set(V.map((v) => v.ii))];
  const k = (ids.indexOf(V[cur].ii) + step + ids.length) % ids.length;
  show(V.findIndex((v) => v.ii === ids[k]));
}
function inIdea(n) { const V = visible(); const j = V.findIndex((v) => v.ii === V[cur].ii && v.vi === n); if (j >= 0) show(j); }
function out() { hidden.add(visible()[cur].id); saveHidden(); show(Math.min(cur, visible().length - 1)); }
function full() { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.(); }
ctl.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.ii) return show(visible().findIndex((v) => v.ii === Number(b.dataset.ii)));
  ({ prev: () => show(cur - 1), next: () => show(cur + 1), phone: () => { phone = !phone; fit(); show(cur); }, full, hide: () => ctl.classList.add("hide"), out, restore: () => { hidden.clear(); saveHidden(); show(0); } })[b.dataset.a]?.();
});
function key(e) {
  const k = e.key.toLowerCase();
  if (k === "arrowright") show(cur + 1);
  else if (k === "arrowleft") show(cur - 1);
  else if (k === "arrowdown") { e.preventDefault(); idea(1); }
  else if (k === "arrowup") { e.preventDefault(); idea(-1); }
  else if (/^[0-9]$/.test(k)) inIdea(Number(k));
  else if (k === "f") full();
  else if (k === "x") out();
  else if (k === "h") ctl.classList.toggle("hide");
  else if (k === "m") { phone = !phone; fit(); show(cur); }
}
addEventListener("keydown", key);
// Tasten auch, wenn der Fokus in der Variante liegt
frame.addEventListener("load", () => { try { frame.contentWindow.addEventListener("keydown", key); } catch {} });
setTimeout(() => (document.getElementById("hint").style.opacity = 0), 6000);
fit();
show(cur);
</script>
</body>
</html>
